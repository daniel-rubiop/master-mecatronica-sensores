<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estación de inspección de estuches</title>
<style>
:root{--bg:#f3f5f8;--surface:#fff;--ink:#18212b;--ink2:#53606e;--line:#d6dce4;--accent:#0f4c81}

body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:40px max(16px,env(safe-area-inset-left,0px))}
main{max-width:760px;margin:0 auto}
h1{margin:0 0 4px;font-size:28px}
p{color:var(--ink2)}
a.card{display:block;margin-top:24px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;color:inherit;text-decoration:none}

</style>
</head>
<body>
<main>
  <h1>Estación de inspección de estuches</h1>
  <p>Simulador 3D de una estación de sensores para estuches de latas de conserva.</p>
  <a class="card" href="estuches-latas/">
    <b>Abrir el simulador →</b>

  </a>
